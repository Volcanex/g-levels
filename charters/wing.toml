id = "wing"
title = "Wing, the friends-matchmaking dating app"
extends = ["delivery", "look"]
repos = ["wing"]
principles = [
  "The asymmetry is a server rule with tests: in straight matching cis men are chosen, never choosers.",
  "Every word a person reads in the app sounds like a person, not an app.",
  "Every skin is night with soft lighting and is laid out with care at phone width.",
]

[[gates]]
id = "correct.product.server-enforced-rules"
version = 1
paths = ["api/**", "tests/**"]
blocking = true

[[gates]]
id = "correct.copy.voice"
version = 2
paths = ["web/theory/index.html", "content/prompts.json", "content/bots.json", "content/decks.json", "content/bot_lines.json"]

[[gates]]
id = "correct.copy.house-glyphs"
version = 1
paths = ["web/theory/index.html", "content/*.json"]

[[gates]]
id = "correct.ui.spacing"
version = 2
paths = ["web/theory/index.html"]

[[gates]]
id = "correct.ui.on-system"
version = 1
paths = ["app/**", "web/**"]

[[gates]]
id = "correct.ui.app-craft"
version = 1
paths = ["app/**"]

[[gates]]
id = "correct.ux.first-run"
version = 1

[[gates]]
id = "correct.ux.option-tree"
version = 1

[[gates]]
id = "correct.product.bot-coverage"
version = 1
