id = "g-content"
title = "g-content: recipes that make judged, rated assets for the other projects"
extends = ["delivery", "look"]
repos = ["g-content"]
principles = [
  "Every piece can be retraced to the recipe, brief, runner, sources and data that made it.",
  "A piece reaches a project only after an independent judge scores it 7 or better, and Gabriel's rating keeps the judge honest.",
  "Pieces are real or crafted in the g-design language: house fonts, tokens, sentence case, calm motion, nothing generated.",
  "Anything that needs a GPU runs on a runner, never on h's CPU pretending or on a work server.",
]

# Results for a piece are recorded against its folder, library/<recipe>/<piece-id>. Every path below
# reaches into that folder, so the record lands in scope, while command sensors that take {file} run
# only on the files a sensor can read (never on PNGs or GLBs, whose bytes would trip a text sensor).

[[gates]]
id = "correct.content.provenance"
version = 1
paths = ["library/*/*/piece.json"]

[[gates]]
id = "correct.content.judge"
version = 1
paths = ["library/*/*/piece.json"]

[[gates]]
id = "correct.assets.real-sourced"
version = 1
paths = ["library/*/*/*.png", "library/*/*/*.jpg", "library/*/*/*.webp", "library/*/*/*.svg"]

[[gates]]
id = "correct.copy.house-glyphs"
version = 1
paths = ["library/*/*/*.svg", "library/*/*/*.html"]

[[gates]]
id = "correct.copy.voice"
version = 2
paths = ["library/*/*/*.svg", "library/*/*/*.html"]

[[gates]]
id = "correct.product.data-truth"
version = 1
paths = ["library/*/*/*.svg", "library/*/*/*.html"]

[[gates]]
id = "correct.motion.rhythm"
version = 1
paths = ["library/*/*/*.html"]

[[gates]]
id = "correct.render.frame-integrity"
version = 1
paths = ["library/*/*/*.mp4", "library/*/*/*.glb", "library/*/*/*.png"]

[[gates]]
id = "design.content.next-recipes"
version = 1
paths = ["recipes/*/recipe.toml"]

# g-content's own pages are one small status page. The look gates inherited with no paths would
# otherwise run their page sensors on every tracked file.

[[gates]]
id = "correct.ui.spacing"
version = 2
paths = ["pages/*/content.html"]

[[gates]]
id = "correct.ui.on-system"
version = 1
paths = ["pages/*/content.html"]
