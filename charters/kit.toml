id = "kit"
title = "The kit refactor: Studio's look moves into g-design and G-Command adopts it"
extends = ["delivery", "look"]
# gcore on h is a symlink to the gp-core checkout, and charters resolve a repo by its real name.
repos = ["g-design", "g-studio", "g-studio-apple", "g-command-web", "g-command-apple", "gcore", "gp-core"]
principles = [
  "Studio's clients see no change, and Gabriel still signs in to Studio directly.",
  "Dependencies point one way: G-Command builds on Studio's Kit and the kit, Studio only on the kit, the kit on neither.",
  "Each app builds with only its declared siblings.",
  "Each repo declares what it connects to and what flows.",
  "No gate here blocks: run it, record it, fix forward.",
]

# Nothing in this charter blocks (Gabriel, 2026-11-03). Every pin says blocking = false, and the
# gates inherited as blocking from g-system and delivery are pinned again here so the narrower,
# non-blocking entry wins.
#
# Scope: a repo takes the one charter with the longest extends chain that names it, and a tie goes
# to the earlier file name. kit ties at four with the g-studio, g-studio-apple, g-command-web and
# g-command-apple charters and sorts after them, so those repos keep their own charter and these
# gates are not in scope there until their charter extends kit. g-design and gcore (gp-core) have
# no charter of their own, so kit is theirs. correct.gcore.connections-declared comes in through
# g-system, beside the other compliance gate.

# The refactor's own gates.

[[gates]]
id = "correct.kit.studio-unchanged"
version = 1
blocking = false

[[gates]]
id = "correct.kit.one-way-imports"
version = 1
blocking = false

[[gates]]
id = "correct.kit.builds-alone"
version = 2
blocking = false

# Existing gates the refactor leans on.

[[gates]]
id = "correct.delivery.concurrent-work-preservation"
version = 1
blocking = false

[[gates]]
id = "correct.delivery.verify-before-claiming-done"
version = 1
blocking = false

[[gates]]
id = "correct.delivery.documentation-truth"
version = 1
blocking = false

[[gates]]
id = "correct.product.server-enforced-rules"
version = 2
blocking = false

[[gates]]
id = "correct.cowork.alone-still-works"
version = 2
blocking = false

# Inherited as blocking from g-system; non-blocking here.

[[gates]]
id = "correct.secrets.git-history"
version = 1
blocking = false

[[gates]]
id = "correct.secrets.argv"
version = 1
blocking = false

[[gates]]
id = "correct.staffing.claude-quota"
version = 1
blocking = false

[[gates]]
id = "correct.staffing.job-shape"
version = 1
blocking = false
