id = "g-system"
title = "The g-system charter"
repos = ["*"]
principles = [
  "Every repo is findable, installable and monitored the same way.",
  "Nothing secret reaches git or argv.",
  "Shared hosts are shared politely: work servers carry only work, services keep their file ownership.",
]

[[gates]]
id = "correct.secrets.git-history"
version = 1
blocking = true

[[gates]]
id = "correct.repo.gcore-boxes"
version = 1

[[gates]]
id = "correct.secrets.argv"
version = 1
blocking = true

[[gates]]
id = "correct.hosts.work-server-quiet"
version = 1

[[gates]]
id = "correct.hosts.service-file-owner"
version = 1

[[gates]]
id = "correct.staffing.claude-quota"
version = 1
blocking = true

[[exceptions]]
gate = "correct.hosts.service-file-owner"
repo = "g-site"
reason = "g-site's service runs as root and its output is root-owned by design."
review = "2027-01-18"
approved_by = "Gabriel"
