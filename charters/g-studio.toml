id = "g-studio"
title = "g-studio, where the people around Gabriel see, edit and run their sites and apps"
extends = ["g-system", "look", "delivery"]
repos = ["g-studio"]
principles = [
  "A person can see, edit and run their own projects safely, and nothing else.",
  "Every surface (web, MCP, agent, terminal, SSH, custom views) enforces the same rules on the server, through one service layer.",
  "Live sites never half-change: a publish applies whole or not at all, and history can undo it.",
  "The studio is obvious to a non-technical person who arrives alone.",
  "Outbound access is an allow-list that never becomes open, so nothing a person's Claude reads can send their keys away.",
  "Studio borrows the G-System's conventions, not its machinery: nothing a client's Claude reads names Brain, the pulse or the spine.",
]

# Security: the reason this charter exists. Each blocks.

[[gates]]
id = "correct.security.tenant-isolation"
version = 1
paths = ["gstudio/**", "sandbox/**", "tests/**"]
blocking = true

[[gates]]
id = "correct.security.path-confinement"
version = 1
paths = ["gstudio/**", "tests/**"]
blocking = true

# The SSH gateway is the second way into a sandbox, beside the terminal.

[[gates]]
id = "correct.security.sandbox-escape"
version = 1
paths = ["sandbox/**", "gstudio/terminal.py", "gstudio/sshgate.py", "tests/sandbox/**"]
blocking = true

[[gates]]
id = "correct.security.agent-tool-boundary"
version = 1
paths = ["gstudio/**", "tests/**"]
blocking = true

[[gates]]
id = "correct.product.server-enforced-rules"
version = 1
paths = ["gstudio/**", "tests/**"]

[[gates]]
id = "correct.security.egress-closed"
version = 1
paths = ["sandbox/egress-defaults.json"]
blocking = true

# What a client's Claude or the studio's own agent reads: the MCP instructions, the agent's
# prompts, the view client, the sandbox login text and the home instructions, mounted as
# /etc/claude-code/CLAUDE.md in every home (feat/homes, contracts.md "Homes").

[[gates]]
id = "correct.studio.client-nerves"
version = 2
paths = ["gstudio/mcp_server.py", "gstudio/agent/prompts.py", "gstudio/project_static/**", "sandbox/image/motd", "sandbox/home/instructions.md"]
blocking = true

# Product: live sites and the paths people take.

[[gates]]
id = "correct.product.publish-integrity"
version = 1
paths = ["gstudio/**", "tests/**"]
blocking = true

[[gates]]
id = "correct.product.preview-parity"
version = 1
paths = ["gstudio/**", "tests/parity/**"]

[[gates]]
id = "correct.product.e2e-journeys"
version = 1

[[gates]]
id = "design.product.feature-ideas"
version = 2

[[gates]]
id = "correct.product.capability-depth"
version = 1
paths = ["web/src/**", "gstudio/**"]

[[gates]]
id = "correct.product.data-truth"
version = 1
paths = ["web/src/**"]

[[gates]]
id = "correct.ux.first-run"
version = 1
paths = ["web/src/**", "web/inject/**"]

[[gates]]
id = "correct.ux.option-tree"
version = 1
paths = ["web/src/**", "web/inject/**"]

[[gates]]
id = "correct.delivery.runtime-clean"
version = 1

[[gates]]
id = "correct.delivery.verify-before-claiming-done"
version = 1
blocking = true

# Copy on the screens people read. The screens are JavaScript, which readerctx cannot read, so
# its mechanical half reports impossible, as the look sensors do here. The reviewer runs
# readerctx --render on the studio URL.

[[gates]]
id = "correct.copy.reader-context"
version = 1
paths = ["web/src/**", "web/inject/**"]

# Look: the studio app and the editor injected into previews.

[[gates]]
id = "correct.ui.spacing"
version = 2
paths = ["web/src/**", "web/inject/**"]

[[gates]]
id = "correct.ui.on-system"
version = 1
paths = ["web/src/**", "web/inject/**"]

[[gates]]
id = "correct.ui.app-craft"
version = 1
paths = ["web/src/**", "web/inject/**"]

[[gates]]
id = "correct.motion.rhythm"
version = 1
paths = ["web/src/**", "web/inject/**"]

[[gates]]
id = "correct.render.frame-integrity"
version = 1
paths = ["web/src/**", "web/inject/**"]

[[gates]]
id = "correct.assets.real-sourced"
version = 1
paths = ["web/src/**", "web/inject/**"]

# Host: the service runs as a non-root user beside a container that breaks on root-owned files.

[[gates]]
id = "correct.hosts.service-file-owner"
version = 1
