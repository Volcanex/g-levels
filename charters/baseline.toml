id = "baseline"
title = "Baseline Labs app, site, decks and emails"
extends = ["delivery", "look"]
repos = ["baseline", "baselinelabs"]
principles = [
  "Every option a customer is offered or promised can be found, with sensible defaults and no dead ends.",
  "Every figure is measured, labelled with its window and source, and about the right entity.",
  "Copy fits the customer reading it: nothing assumed, nothing about our process.",
  "A capability on one surface reaches its siblings, and results come interpreted.",
]

[[gates]]
id = "correct.ux.option-tree"
version = 1

[[gates]]
id = "correct.product.data-truth"
version = 1

[[gates]]
id = "correct.product.capability-depth"
version = 1

[[gates]]
id = "correct.copy.reader-context"
version = 1
paths = ["core/emails/**", "core/pages/admin/decks/**", "geo/pages/**"]

[[gates]]
id = "design.product.feature-ideas"
version = 2

