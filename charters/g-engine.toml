id = "g-engine"
title = "g-engine, judged on its own debug range"
extends = ["delivery"]
repos = ["g-engine"]
principles = [
  "The engine is judged on its debug range, by eye, from seeded screenshots, before any soak number.",
  "Destruction looks right in a still frame and breaks on the frame the blast lands.",
  "A feature that breaks the engine is known to be broken and stays off in the default build.",
  "Precompute: never compute at runtime what can be computed before. Pieces, support, shapes and templates are cut before play.",
  "Systems meet through data and behaviour emerges from them. There is no scenario code.",
  "Cost is local and bounded: what a change costs depends on where it happens and how much is going on there, never on the size of the world.",
  "Every process ends. Fires burn out, debris sleeps, flows stop.",
  "On g-engine, beauty means the internal design (renderer, physics, optimisation, emergent and data-driven systems), not visual polish. The owner's open bugs come first.",
  "The range is the engine's only level. A game lives in its own repo.",
]

