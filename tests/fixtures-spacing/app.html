<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas app</title><style>
* { box-sizing: border-box; } body { margin: 0; font: 16px/24px sans-serif; }
canvas { display: block; width: 100%; height: 70vh; background: #ddd; }
main { padding: 24px; } h1 { margin: 0; font-size: 24px; }
.float { position: fixed; top: 0; left: 0; width: 40px; height: 40px; background: #999; }
.float.second { left: 20px; background: #666; }
</style><canvas aria-label="Game table"></canvas><div class="float" aria-label="First floating tool"></div><div class="float second" aria-label="Second floating tool"></div><main><h1>Waiting</h1></main>
<script>
setTimeout(() => { if (localStorage.fixture === 'present') { document.querySelector('h1').id = 'ready'; document.querySelector('h1').textContent = 'Ready'; } }, 100);
document.addEventListener('keydown', event => { if (event.key === 'n') document.querySelector('h1').textContent = 'Next'; });
</script></html>
