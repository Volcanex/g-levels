<!doctype html><meta charset="utf-8"><title>Snappy feedback</title>
<style>body{background:#111}#box{width:80px;height:80px;background:#eee;transition:transform 40ms cubic-bezier(.2,0,0,1)}#box.go{transform:translateX(300px)}@media(prefers-reduced-motion:reduce){#box{transition:none}}</style>
<div id="box"></div><script>setTimeout(()=>box.classList.add('go'),350)</script>
