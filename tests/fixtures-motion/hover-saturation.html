<!doctype html><meta charset="utf-8"><title>Small saturation ramp</title>
<style>body{background:#111}#box{width:240px;height:180px;background:linear-gradient(45deg,#805060,#507060);filter:saturate(1);transition:filter 200ms ease-in-out}#box:hover{filter:saturate(1.1)}@media(prefers-reduced-motion:reduce){#box{transition:none}}</style>
<div id="box" data-hover></div>
