<!doctype html><meta charset="utf-8"><title>Visible watched field and a deliberate pointer move</title>
<style>
body{margin:0;background:#111}
#field{position:fixed;inset:0;background:repeating-linear-gradient(90deg,#122 0 12px,#48a 12px 24px);animation:hold 30s linear infinite}
@keyframes hold{from{opacity:1}to{opacity:1}}
.presence-ptr{position:absolute;width:12px;height:18px;background:white}
</style>
<div id="field" data-motion="narrative"></div><div id="pointer" class="presence-ptr" data-motion="pointer"></div>
<script>
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){const t=now/1000;
if(!reduced)field.style.backgroundPosition=`${40*Math.sin(.47*t)}px 0`;
const u=Math.min(1,t/6), k=u*u*u*(10+u*(-15+6*u));
pointer.style.transform=`translate(${Math.round(100+(reduced?0:300*k))}px,100px)`;
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
