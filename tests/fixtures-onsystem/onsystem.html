<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected services</title>
<style>@import url("g.css");</style>
</head>
<body>
<main class="card">
<h1>Connected services</h1>
<p class="hint">Review your services before deploying.</p>
<div class="field">
<label class="label" for="name">Service name</label>
<input class="input" id="name" value="production-api">
</div>
<label class="choice"><input class="checkbox" type="checkbox" checked>Run health probe</label>
<label class="choice"><input class="radio" type="radio" name="visibility" checked>Private to the workspace</label>
<button class="btn btn-primary">Save changes</button>
<button class="btn btn-secondary">Preview</button>
</main>
</body>
</html>
