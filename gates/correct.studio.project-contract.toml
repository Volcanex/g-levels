id = "correct.studio.project-contract"
version = 1
kind = "correcting"
trigger = "every-run"
principle = "A client project repo carries what the studio reads from it: its nerves, a studio.json that parses and, when it has a runtime, a /health endpoint and declared depends."
guidance = """
The studio enforces what it reads and offers what a client's Claude reads. What it reads from a
project's repo:
- Nerves: CLAUDE.md and AGENTS.md at the root, and an AGENTS.md beside every CLAUDE.md (a
  symlink is fine). The project's Ask AI, its MCP clients and Gabriel's agents start from them.
- studio.json at the root, a JSON object. `{"views": []}` is the smallest valid one. The
  studio's own validator (gstudio/views.py) owns the schema and names the exact problem to
  the project's developers. This gate checks only that the file parses, so it never drifts
  from the studio's rules.
- A runtime (studio.json declares `backend`) serves `/health` with the standard contract,
  `{"ok", "checks"}` and 200 while the process is up, with a check per dependency. It declares
  `depends` under [tool.gcore] in pyproject.toml, `[]` when it has none.
"""
pass = "Root CLAUDE.md and AGENTS.md exist, every CLAUDE.md has its AGENTS.md, studio.json parses as a JSON object, and a project that declares a backend has a /health route and declared depends."
remediation = "Add what the sensor lists. A missing studio.json starts as {\"views\": []}. A runtime without /health gets one that reports each dependency in checks. Never add a /health that always says ok."
written_against = { model = "claude-opus-5-5", date = "2026-10-26" }

[sensor]
type = "command"
run = "python3 ${GLEVELS:-/home/gabriel/g-levels}/glevels/studio.py contract {repo}"
cannot_run_exit = 2

[origin]
date = "2026-10-26"
incident = "The Studio plan has the studio check every gsp- repo on push for nerves, a valid studio.json, the /health contract and depends, blocking only what would break the studio. This gate is that check, run before the push."
