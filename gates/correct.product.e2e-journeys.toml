id = "correct.product.e2e-journeys"
version = 1
kind = "correcting"
trigger = "milestone"
skill = "webapp-testing"
principle = "The paths real people take through the product pass end to end in a real browser against the real service, at phone and desktop widths, before a milestone ships. A unit suite that passes while a journey is broken is not done."
guidance = """
Keep an end-to-end suite, marked `e2e`, that starts the real server (for g-sites, uvicorn on a
free port with fixture sites and a temp state dir) and drives it with Playwright as a person
would. Each journey runs at a phone width (390) and a desktop width (1440) and checks the
visible result, not only a status code. For a site editor the journeys are: sign in, edit text
inline on the preview, swap an image, add a collection item, publish and see the fixture live
output change, revert from history, an AI edit through a stub provider, a terminal echo, and an
MCP client round trip. Add a journey whenever a new surface ships.
The suite takes the host's browser lock itself and never writes to real sites. When the
browser or a dependency is missing it skips with the reason, and the sensor reports that as
impossible, not met.
"""
pass = "met: every journey ran at both widths and passed, nothing skipped. impossible: the browser or a dependency is missing here, or a journey skipped, with the reason. attempted is not available: a broken journey is a catch."
remediation = "Read the failing journey, its step and width, and its screenshot or trace. Reproduce it in the browser, fix the product, rerun the whole suite. Never delete a step, widen a timeout to hide a hang, or drop a width."
written_against = { model = "claude-opus-5-5", date = "2026-10-24" }

[sensor]
# 75 means it could not run here (no Playwright, or a journey skipped); other non-zero codes are catches.
type = "command"
run = '''cd {repo} && { PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -c 'import playwright' >/dev/null 2>&1 || { echo 'e2e-journeys: Playwright is not installed in the venv'; exit 75; }; } && out=$(PYTHONDONTWRITEBYTECODE=1 timeout 2400 .venv/bin/python -m pytest -q -rs -p no:cacheprovider -m e2e 2>&1); rc=$?; printf '%s\n' "$out" | tail -n 40; if [ $rc -eq 0 ] && printf '%s\n' "$out" | grep -Eq '[0-9]+ skipped'; then echo 'e2e-journeys: journeys were skipped, so they prove nothing here'; exit 75; fi; exit $rc'''
cannot_run_exit = 75

[origin]
date = "2026-10-24"
incident = "g-sites build: the operator asked for a client studio tested within an inch of its life, where unit tests alone would let a broken sign-in, editor or publish reach a client."
