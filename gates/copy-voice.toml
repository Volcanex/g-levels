id = "copy-voice"
version = 1
kind = "correcting"
trigger = "every-run"
principle = "Copy a person reads never sounds like AI. It sounds like Gabriel in the register the piece needs."
guidance = "Load the anti-ai-voice skill before writing. No em dashes, middle dots or semicolons."
pass = "ganti scores the file at or below the calibrated low threshold."
remediation = "Run `ganti score <file>` and work its findings, generic ones first. Rewrite, do not swap synonyms."
enforced_by = "~/.claude/hooks/ganti-gate.py blocks absolutes at Write time. This gate is the after-the-fact sensor."
written_against = { model = "claude-opus-5-5", date = "2026-10-15" }

[sensor]
type = "command"
run = "ganti score --low --no-log {file}"

[origin]
date = "2026-10-15"
incident = "Site and outreach copy kept reading as generated. Gabriel was the only sensor, so every piece needed a manual pass."
