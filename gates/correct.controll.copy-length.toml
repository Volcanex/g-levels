id = "correct.controll.copy-length"
version = 1
kind = "correcting"
trigger = "every-run"
skill = "anti-ai-voice"
principle = "The landing page stays short: the claim, who made it, the way in, and three figures with a line each."
guidance = """
Budgets per language, counted from the page's COPY table: the hero (eyebrow, tag, founders line, the two buttons and the note under them) at most 60 words; the tag at most 32 words in English and 36 in Norwegian; each figure's paragraph at most 45 words (50 Norwegian); everything together at most 420 words (460 Norwegian). Cut before you add. A new section needs an old one to shrink.
"""
pass = "met: scripts/gates/copy_budget.py exits 0."
remediation = "The script prints each over-budget key with its count. Cut words from that key; do not move text into a key the budget does not count."
written_against = { model = "claude-opus-5-5", date = "2026-11-08" }

[sensor]
type = "command"
run = "cd {repo} && python3 scripts/gates/copy_budget.py web/landing/index.html"

[origin]
date = "2026-11-08"
incident = "Gabriel: keep the landing short, as it is now, and cut the text further."
