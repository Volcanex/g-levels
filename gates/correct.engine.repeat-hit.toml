id = "correct.engine.repeat-hit"
version = 1
kind = "correcting"
trigger = "every-run"
principle = "Damage tests against the world as it is now. A shot into an existing breach passes through it or hits real remaining geometry, and nothing is ever carved or drawn outside solid geometry."
guidance = "Every hit test (projectile ray, fuse, contact, forecast) must read the post-carve state, and the drawn hole must use the same coordinates as the carve. Write the failing reproduction first."
pass = "met: the repeat-hit test fires into a carved breach and the projectile passes through or detonates on remaining solid, with no carve or mask outside solid, and the range repeat-hit bay shows it. attempted: the sim test passes but the bay still shows a fault, or the reverse."
remediation = "The test prints where the second detonation landed and what it tested against. Fix the stale state at its source; do not add a special case for holes."
written_against = { model = "claude-opus-5-5", date = "2026-10-20" }

[sensor]
type = "command"
run = "cd {repo} && node v2/tests/range/gate.mjs repeat-hit"
cannot_run_exit = 2

[origin]
date = "2026-10-20"
incident = "A rocket shot into an existing hole spawned a smaller hole in mid air."
