id = "correct.secrets.argv"
version = 1
kind = "correcting"
trigger = "milestone"
principle = "A secret never appears in a process's arguments. sudo logs argv and host stats snapshot the process list."
guidance = "Pass secrets through stdin or a 0600 file the command reads. Never `cmd --token $X`, `sudo VAR=secret ...` or a secret in a URL."
pass = "No command the work runs or adds places a secret in argv, including scripts, units and cron lines."
remediation = "Rewrite to read from stdin, an env file loaded by the unit, or a 0600 file. If one leaked, rotate it."
written_against = { model = "claude-opus-5-5", date = "2026-10-17" }

[sensor]
type = "review"
rubric = "Read every command, script, unit and cron line the work added or ran. Does any carry a credential in its arguments or URL?"

[origin]
date = "2026-10-17"
incident = "A token passed on a sudo command line on host b landed in sudo's log and a host-stats snapshot. Held as a memory until now."
