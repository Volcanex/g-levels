id = "correct.secrets.git-history"
version = 1
kind = "correcting"
trigger = "every-run"
principle = "No credential ever enters git history. Public repos stay public safely."
guidance = """
Secrets live in the passport (.env, never committed) or a 0600 file. Code reads them from
the environment. Fixtures use obviously fake values.
"""
pass = "gitleaks finds nothing in the repo's history."
remediation = """
Remove the secret, rotate it (it is compromised the moment it is pushed), and rewrite
history only with Gabriel's say-so. An allowlisted false positive goes in .gitleaksignore
with a comment.
"""
written_against = { model = "claude-opus-5-5", date = "2026-10-17" }

[sensor]
type = "command"
run = "gitleaks git {repo} --no-banner --redact --exit-code 1"

[origin]
date = "2026-10-10"
incident = "Leaked keys found in the schemas of three repos while flipping the g-system public. They were hidden, and a history scan of 16 public repos followed."
