id = "correct.ui.theme-contrast"
version = 1
kind = "correcting"
trigger = "every-run"
skill = "g-design"
principle = "Every foreground a UI draws reads against the ground it sits on, in every theme it ships, not only the one it was designed in."
guidance = """
Themes are data, so a pairing that works in one palette can vanish in another: a 1.5 px line
border that reads on a green ground disappears on a near-black one. Before drawing a token as a
foreground (text, an icon, a border that is a control's only affordance, a control's fill),
check it against its ground in every shipped theme. Text needs 4.5:1, or 3:1 at 24 px or
18.66 px bold. Control boundaries, icons and chart marks that carry meaning need 3:1
(WCAG 1.4.11). Composite alpha tokens over their ground before measuring. A divider that only
separates is exempt. A border that is the only sign something can be tapped is not.
Add each new pairing to the repo's contrast pair list in the same commit as the widget. Fix a
failing pair in the token, or give the control a fill in the shared widget. Never special-case
one theme inside a widget.
"""
pass = "met: the repo's contrast sensor passes in every shipped theme and the reviewer finds no pairing the change draws that is missing from its pair list. impossible: the toolchain cannot run here, with the reason. attempted is not available: a failing pair is a catch."
remediation = "The sensor names the theme, the pair, the measured and required ratio, and where it is drawn. Change the token so it clears in that theme (rerun every theme and the design-page parity test), or give the control a fill or stronger boundary in the shared widget so every screen gets the fix. Never drop a pair from the list or lower a threshold to pass."
written_against = { model = "claude-opus-5-5", date = "2026-10-30" }

[sensor]
type = "command"
run = "cd {repo} && sh .glevels/contrast.sh"
cannot_run_exit = 2

[origin]
date = "2026-10-30"
incident = "On his phone, Gabriel found Controll buttons that did not work in the dark themes. No charter scoped the repo, and nothing checked a token pairing across themes."

[validation]
date = "2026-10-30"
sensor = "gsp-controll .glevels/contrast.sh (app/test/contrast_test.dart, pairs of kind text and control fail, chart pairs report only)"
cases = [
  "original: main's tokens (6b5cd86) -> catch 'natt: line on raised [control] = 1.698:1; required 3.0:1', the outline Gabriel could not see on his phone",
  "related: Natt with onAccent set equal to accent -> catch 'onAccent on accent [text] = 1.000:1'",
  "clean: the twilight palette (branch twilight, d3ec2fd) in Skymning, Natt, Grön, Isblå and Ljus -> exit 0, with chart washes and bands printed as information and not failed",
]
