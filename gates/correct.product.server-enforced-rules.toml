id = "correct.product.server-enforced-rules"
version = 1
kind = "correcting"
trigger = "every-run"
principle = "A product rule that decides who may do what lives on the server as a pure function with tests. The client only reads the flags it is given."
guidance = "Put the rule in one pure module (for Wing, api/rules.py) and call it from every route that acts on it. Test the allowed and refused cases for each kind of person, including the edge ones (trans men, non-binary people, pairs, queer contexts). Never work the rule out again in the client."
pass = "met: the repo's pytest suite passes and covers each rule's allowed and refused cases. attempted: tests pass but an edge case named in the guidance has no test, named in the note."
remediation = "Read the failing test's assertion. Fix the rule or the route, not the test. If a route skipped the rule, call the rule from it and add a test that hits the route as a refused user."
written_against = { model = "claude-opus-5-5", date = "2026-10-18" }

[sensor]
type = "command"
run = "cd {repo} && .venv/bin/python -m pytest -q -x tests"

[origin]
date = "2026-10-18"
incident = "Wing's core is an asymmetry (who can browse and pitch). A rule enforced only in the client would let anyone call the API as a chooser."
