id = "design.product.feature-ideas"
version = 2
kind = "design"
trigger = "milestone"
skill = "g-product"
principle = "Before a feature set is called done, the space of things it could become has been explored until new ideas dry up."
guidance = """
Read the product, its users and what exists. Propose features it would benefit from,
each with who it serves and why now, and how it turns raw results into meaning for that user.
Different runs take different framings (listed in framings below). Ideas that only give one
surface a capability its siblings lack are not new features: that is correct.product.capability-depth.
"""
framings = [
  "a first-time user who signed up today and wants a result in five minutes",
  "a power user who runs this every week and is tired of the gaps",
  "the product lead of the strongest rival, looking for what to copy and what to beat",
  "Gabriel's own taste: rich, interpreted, nothing half-built, every surface gets it",
  "a sceptical paying customer deciding whether to renew",
  "the person the user reports to, who only sees the output",
]
pass = "met: saturation reached within budget and the probe from another model family added at most one idea. The ranked shortlist goes to Gabriel, who picks. attempted: the budget ran out first, or the probe found more, so the space is richer than the run."
remediation = "If the budget ran out before saturation, or the probe added ideas, say so and give the counts. Run again with more rounds or new framings drawn from what the probe found. Never cut the round count to reach saturation sooner."
generators = "Strong, taste-capable models only: Claude Opus through g-agent-run, pinned by the runner. Cheap fan-out produces more of the same and saturates on the model's range, not the space. Generators are blind to each other's ideas, so the new-idea count is honest."
judge = "One Claude Opus call per round merges each raw idea into the canonical list or adds it, citing the raw idea. The runner drops anything the judge adds without a citation, so the judge cannot generate. A last call ranks the list."
saturation = "Stop when a round of three generators adds fewer than one new idea after merging."
probe = "After apparent saturation, one round from a different strong model family (Codex Astra, else Sol at high effort). New ideas there mean the generator ran out, not the space."
budget = "At most four rounds, plus the probe."
written_against = { model = "claude-opus-5-5", date = "2026-10-20" }

[sensor]
# v2: the runner exists. glevels/ideas.py runs generators, judge, saturation, probe and budget
# from this file and writes shortlist.md, ideas.json and rounds.jsonl. It spends Opus calls, so
# it is not a `run` command: a milestone check prints this rubric and the runner is started on purpose.
type = "review"
rubric = """
1. Write a brief file: what the product is, who uses it and for what, what exists now (surfaces, screens, paths to full-size screenshots), and what was just built.
2. Run `python3 -m glevels.ideas design.product.feature-ideas --brief <file> --workdir <repo> --out <dir>` (add --dry-run first to see the plan). It prints new ideas per round, the stop reason and a verdict.
3. Read shortlist.md before passing it on. Each idea must name who it serves, what it does and how it interprets results for them. Drop any that is only a sibling-parity fix and route it to correct.product.capability-depth instead.
4. Send Gabriel shortlist.md with the counts per round. He picks; nothing on the list is built without his pick.
5. Record met at saturation with a quiet probe, attempted otherwise, with the counts in the note.
"""

[origin]
date = "2026-10-18"
incident = "Gabriel named the class: open-ended quality like feature richness improves with the intelligence poured in, and nothing in the system asked for it. v2 (20 Oct) adds the runner, after 12 feature-richness corrections such as 'is visibility seriously the only one that has manual control?' (29 Sep) and 109 sweep ideas that never became tools (20 Oct)."
